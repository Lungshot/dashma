services:
  dashma:
    build: .
    container_name: dashma
    restart: unless-stopped
    # Required for ICMP ping monitoring
    cap_add:
      - NET_RAW
    ports:
      - "3685:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # COOKIE_SECURE: Set to 'true' whenever the BROWSER reaches Dashma over HTTPS.
      # That includes both direct HTTPS and access through a reverse proxy
      # (Caddy/nginx/Traefik) that terminates TLS. Dashma trusts the proxy's
      # X-Forwarded-Proto header, so the Secure cookie is set correctly behind a proxy.
      # Only leave it unset/'false' for plain-HTTP access (e.g. http://host:port on a LAN).
      # - COOKIE_SECURE=true
      #
      # SESSION_SECRET: Signs the session cookie so sessions cannot be forged.
      # Use a random string of at least 32 characters and keep it SECRET.
      # Keep it stable across restarts -- changing it logs everyone out.
      # Generate one with: openssl rand -base64 48
      # - SESSION_SECRET=your-secure-random-string-minimum-32-characters
    volumes:
      - dashma_data:/app/src/data
      - dashma_uploads:/app/src/public/uploads

volumes:
  dashma_data:
  dashma_uploads:
